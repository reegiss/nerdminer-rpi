name: C/C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: install dependencies
      run: sudo apt-get update && sudo apt-get install -y libboost-all-dev libssl-dev nlohmann-json3-dev
    - name: configure
      run: cmake -B build
    - name: make
      run: cmake --build build
    - name: make check
      run: ctest --test-dir build --output-on-failure
